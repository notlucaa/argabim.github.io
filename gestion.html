<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Argabim</title>

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none'; 
        script-src 'self' https://cdn.jsdelivr.net; 
        style-src 'self' https://fonts.googleapis.com; 
        font-src 'self' https://fonts.gstatic.com; 
        connect-src 'self' https://ytjchmyygwxhzlpuyspi.supabase.co;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    ">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Strict-Transport-Security" content="max-age=63072000; includeSubDomains; preload">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">

    <!-- Supabase SDK with SRI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"
        integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
        crossorigin="anonymous"></script>
</head>

<body class="admin-body">

    <div class="admin-container">
        <!-- LOADING STATE -->
        <div id="init-loader">
            <p>Chargement de l'interface...</p>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="login-box hidden">
            <h1 class="section-title">Accès <span class="gradient-text">Privé</span></h1>
            <form id="login-form">
                <div class="admin-form-group">
                    <label for="email" class="admin-form-label">Email Admin</label>
                    <input type="email" id="email" required placeholder="admin@argabim.fr" class="admin-form-input">
                </div>
                <div class="admin-form-group mb-2">
                    <label for="password" class="admin-form-label">Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••" class="admin-form-input">
                </div>
                <button type="submit" class="btn btn-primary admin-btn">Se connecter</button>
            </form>
            <p id="error-msg" class="admin-error-msg"></p>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="dashboard hidden">
            <div class="header-bar">
                <h2>Messages reçus</h2>
                <button id="logout-btn" class="btn-danger">Déconnexion</button>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="messages-body">
                        <!-- JS generated content -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="loading-message">Chargement...</div>
        </div>
    </div>

    <!-- Admin Logic -->
    <script src="admin-script.js"></script>
</body>

</html>
